<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личный кабинет — Распечатайэто</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/">Распечатай<span>это</span></a>
    <nav><button class="btn ghost" id="logout" type="button">Выйти</button></nav>
  </div>
</header>

<main class="wrap" style="padding-top:28px;padding-bottom:40px">
  <h1 style="margin:0 0 4px">Личный кабинет</h1>
  <p id="email" style="color:var(--muted);margin:0 0 20px"></p>
  <div id="notice"></div>
  <div class="grid" id="list" style="padding-top:0"></div>
</main>

<footer>
  <a href="/offer.html">Публичная оферта</a>
  <a href="/privacy.html">Политика конфиденциальности</a>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ICONS = { spravki: '📜', kupony: '🎟️', rodoslovnaya: '🌳' };
const fmt = (ms) => new Date(ms).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function freeNote(f) {
  if (!f) return '';
  const unit = f.limit === 1 ? f.forms[1] : f.forms[2];
  const text = f.kind === 'people'
    ? 'Бесплатно: до ' + f.limit + ' человек в древе'
    : 'Бесплатно: осталось ' + f.remaining + ' из ' + f.limit + ' ' + unit + ' для печати';
  return '<div style="font-size:13px;margin-top:6px">' + esc(text) + '</div>';
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
}

async function load() {
  const d = await (await fetch('/api/me')).json();
  if (!d.user) { location.href = '/login.html'; return; }
  $('email').textContent = d.user.email;

  if (params.get('need')) {
    const a = d.apps.find((x) => x.slug === params.get('need'));
    if (a && !a.active) $('notice').innerHTML = '<div class="notice">Чтобы открыть «' + esc(a.title) + '», оформите подписку ниже.</div>';
  }

  if (params.get('upgrade')) {
    const a = d.apps.find((x) => x.slug === params.get('upgrade'));
    if (a && !a.active) $('notice').innerHTML = '<div class="notice">Бесплатный лимит в «' + esc(a.title) + '» исчерпан. Оформите подписку, чтобы продолжить.</div>';
  }

  $('list').innerHTML = d.apps.map((a) => {
    let status, actions;
    if (a.active) {
      status = '<span class="tag on">Активна до ' + fmt(a.paidUntil) + '</span>';
      actions = '<a class="btn" href="/app/' + a.slug + '">Открыть</a>' +
        (a.autoRenew
          ? '<button class="btn ghost" data-act="cancel" data-app="' + a.slug + '">Отключить автопродление</button>'
          : '<span style="color:var(--muted);font-size:14px">Автопродление выключено</span>');
    } else {
      status = '<span class="tag off">' + (a.paidUntil ? 'Подписка закончилась' : 'Не оформлена') + '</span>' + freeNote(a.free);
      actions = '<a class="btn" href="/app/' + a.slug + '">Попробовать бесплатно</a>' +
        '<button class="btn" data-act="buy" data-app="' + a.slug + '">Оформить за ' + parseInt(d.price, 10) + ' ₽ / мес</button>';
    }
    return '<article class="card"><div class="emoji">' + (ICONS[a.slug] || '') + '</div><h2>' + esc(a.title) + '</h2>' +
      '<div>' + status + '</div><div class="row" style="margin-top:6px">' + actions + '</div></article>';
  }).join('');
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  b.disabled = true;
  if (b.dataset.act === 'buy') {
    const { ok, data } = await post('/api/subscribe', { app: b.dataset.app });
    if (ok && data.url) { location.href = data.url; return; }
    alert(data.error || 'Не удалось начать оплату');
    b.disabled = false;
  } else if (b.dataset.act === 'cancel') {
    if (confirm('Отключить автопродление? Доступ сохранится до конца оплаченного срока.')) {
      await post('/api/cancel', { app: b.dataset.app });
    }
    load();
  }
});

$('logout').onclick = async () => { await post('/api/logout'); location.href = '/'; };

(async () => {
  // После возврата с оплаты проверяем платёж в ЮKassa (вебхук может прийти чуть позже)
  if (params.get('paid')) {
    $('notice').innerHTML = '<div class="notice">Проверяем оплату…</div>';
    await post('/api/sync');
    $('notice').innerHTML = '';
  }
  load();
})();
</script>
</body>
</html>
